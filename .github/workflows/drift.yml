name: drift

# Daily: does every repo tagged `claude-code-plugin` have a marketplace entry?
# Opens one issue per drift report. Uses the built-in GITHUB_TOKEN, no secrets.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare topics with marketplace.json
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/check-drift.mjs > drift-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat drift-report.md
      - name: Open or update the drift issue
        if: steps.drift.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Marketplace drift: tagged repos and marketplace.json disagree"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift-report.md
          else
            gh issue create --title "$title" --body-file drift-report.md
          fi
      - name: Fail the run so the drift shows in the Actions tab
        if: steps.drift.outputs.status != '0'
        run: exit 1
