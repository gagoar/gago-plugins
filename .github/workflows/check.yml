name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: README, hub page and catalog match marketplace.json
        run: node scripts/sync.mjs --check

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Hub page has no sideways scroll and 44px tap targets at 360px and 390px
        run: python scripts/check-mobile.py docs/index.html --shots mobile-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-shots
          path: mobile-shots
